server:
  # 端口约定：后端服务 20001–20999（本服务 20001），MCP 服务 21001–21999（weather-mcp 21001）。
  # 新增服务按段位顺延，避免与常见默认端口（8080/8081 等）撞车。
  port: ${SERVER_PORT:20001}
spring:
  # 本项目的认证完全走自研的 JwtAuthFilter + POST /api/auth/login，没有 UserDetailsService。
  # 不排除这条自动配置，Spring Boot 会在启动时建一个内存用户并往控制台打
  # 「Using generated security password: ...」——既用不上，又容易被当成登录故障的线索。
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/advisory}
    username: ${DB_USER:advisory}
    password: ${DB_PASSWORD:advisory}
  jpa:
    hibernate.ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  servlet.multipart:
    max-file-size: 50MB
    max-request-size: 50MB
management.endpoints.web.exposure.include: health,info,metrics
app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-32bytes-min}
    access-ttl: PT30M
    refresh-ttl: P7D
  encryption-key: ${APP_ENCRYPTION_KEY:dev-only-32-byte-key-change-me!!}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    # 仅供签发上传 URL 使用的地址。留空则与 `endpoint` 相同。在 docker compose 里，
    # 内网端点 http://minio:9000 是浏览器解析不了的，因此必须在这里配置宿主机可达的地址，
    # 上传才能正常工作。
    public-endpoint: ${MINIO_PUBLIC_ENDPOINT:}
    # MinIO 实际上只支持默认 region；这里写死是为了让预签名不必先发请求探一次。
    region: ${MINIO_REGION:us-east-1}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET:advisory}
  bootstrap-admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:admin}
  ingest:
    # 裁切队列容量：单线程先进先出，同一时刻只处理一个文档。排队数超过容量时新的提交会被拒绝，
    # 文档直接置为 FAILED 并提示「队列已满，请稍后重试」，可以手动重试——不会无声无息地卡在排队中。
    queue-capacity: ${INGEST_QUEUE_CAPACITY:500}
  embedding:
    dimension: 1024
  retrieval:
    # 向量路径的相关性下限：整轮最高余弦相似度低于它，就判为「知识库没有这方面内容」，整轮丢弃。
    # 没有下限时，任何输入（包括「你好」）都能凑出 topK 条「最像的」片段，编排器会把噪声当证据，
    # 于是多跑两轮反思、最后基于无关片段作答。
    # 默认 0.55 是按 bge-m3 实测定的：寒暄/无关问题 top1 落在 0.41–0.54，真实问题落在 0.60–0.78。
    # 换用底噪更低的向量模型（例如 OpenAI text-embedding-3）时，请按实际分布下调，或设 0 关闭。
    min-similarity: ${RETRIEVAL_MIN_SIMILARITY:0.55}
  chat:
    # Ollama 请求里的 num_ctx，同时也是编排器裁剪证据时用的窗口——两处必须一致。
    # Ollama 服务端默认只有 4096（OLLAMA_CONTEXT_LENGTH），跨轮累积的检索证据很容易把它撑爆，
    # 报错形如 `request (5448 tokens) exceeds the available context size (4096 tokens)`。
    # 显存紧张时调小，换用大窗口模型时调大；不配则用 8192。
    context-window-tokens: ${CHAT_CONTEXT_WINDOW_TOKENS:8192}
  mcp:
    # 外部 MCP 工具服务清单。连接在后台线程完成并定期重试：某个 MCP 没起来、正在重启，
    # 都不影响主服务启动与普通问答，只是那段时间它提供的工具不可用。
    # 加一个 MCP 服务 = 加一条 servers；name 用于日志与工具重名时的前缀。
    enabled: ${MCP_ENABLED:true}
    request-timeout: ${MCP_REQUEST_TIMEOUT:20s}
    retry-interval: ${MCP_RETRY_INTERVAL:30s}
    servers:
      - name: weather
        sse-url: ${WEATHER_MCP_URL:http://localhost:21001/sse}
      - name: news
        sse-url: ${NEWS_MCP_URL:http://localhost:21002/sse}
