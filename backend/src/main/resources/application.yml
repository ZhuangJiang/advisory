server:
  port: 8080
spring:
  # 本项目的认证完全走自研的 JwtAuthFilter + POST /api/auth/login，没有 UserDetailsService。
  # 不排除这条自动配置，Spring Boot 会在启动时建一个内存用户并往控制台打
  # 「Using generated security password: ...」——既用不上，又容易被当成登录故障的线索。
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/advisory}
    username: ${DB_USER:advisory}
    password: ${DB_PASSWORD:advisory}
  jpa:
    hibernate.ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  servlet.multipart:
    max-file-size: 50MB
    max-request-size: 50MB
management.endpoints.web.exposure.include: health,info,metrics
app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-32bytes-min}
    access-ttl: PT30M
    refresh-ttl: P7D
  encryption-key: ${APP_ENCRYPTION_KEY:dev-only-32-byte-key-change-me!!}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    # 仅供签发上传 URL 使用的地址。留空则与 `endpoint` 相同。在 docker compose 里，
    # 内网端点 http://minio:9000 是浏览器解析不了的，因此必须在这里配置宿主机可达的地址，
    # 上传才能正常工作。
    public-endpoint: ${MINIO_PUBLIC_ENDPOINT:}
    # MinIO 实际上只支持默认 region；这里写死是为了让预签名不必先发请求探一次。
    region: ${MINIO_REGION:us-east-1}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET:advisory}
  bootstrap-admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:admin}
  embedding:
    dimension: 1024
