services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: advisory-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-advisory}
      POSTGRES_USER: ${DB_USER:-advisory}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-advisory}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-advisory} -d ${DB_NAME:-advisory}"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio:
    image: minio/minio
    container_name: advisory-minio
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12

  # 一次性任务：建好桶就退出。后端会等它执行完成——否则后端虽然起来了但没有桶，
  # 上传请求会被接收，直到预签名那一步才失败。
  minio-init:
    # 服务端镜像本身就在 /opt/bin/mc 带了这个客户端，无需另起一个镜像
    # （而且不是每个镜像仓库都能拉到 minio/mc）。
    image: ${MINIO_IMAGE:-minio/minio}
    container_name: advisory-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-advisory}
    entrypoint: ["/bin/sh", "/init-bucket.sh"]
    volumes:
      - ./deploy/init-bucket.sh:/init-bucket.sh:ro
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: backend/advisory-server/Dockerfile
    container_name: advisory-backend
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-advisory}
      DB_USER: ${DB_USER:-advisory}
      DB_PASSWORD: ${DB_PASSWORD:-advisory}
      MINIO_ENDPOINT: http://minio:9000
      # 这个地址会被签进上传 URL，因此必须是浏览器实际访问的地址。
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-http://localhost:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-advisory}
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-32bytes-min}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-dev-only-32-byte-key-change-me!!}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      # 天气 MCP 服务（独立容器）。刻意不加 depends_on：连不上时天气问题回退到知识库检索，
      # 不能让 MCP 的启停决定问答主链路能否启动。
      WEATHER_MCP_URL: http://weather-mcp:8081/sse
    ports:
      - "8080:8080"
    healthcheck:
      # 运行时镜像是 alpine，自带 busybox wget，不必再装包。
      # 这里写 127.0.0.1 而不是 localhost：容器内 localhost 可能优先解析到 ::1，
      # 而 JVM/nginx 只监听 IPv4，结果一个本来健康的服务被报成「连接被拒绝」。
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: advisory-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/healthz | grep -q ok"]
      interval: 10s
      timeout: 5s
      retries: 6

  # 独立的 MCP 服务，与 backend 无依赖关系：backend 挂了它照样提供服务，
  # 它挂了也不影响问答主链路。端口对外暴露，MCP 客户端直接连 http://<host>:8081/sse。
  weather-mcp:
    build:
      context: .
      dockerfile: backend/mcp-server/weather-mcp/Dockerfile
    container_name: advisory-weather-mcp
    environment:
      WEATHER_PROVIDER: ${WEATHER_PROVIDER:-open-meteo}
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8081/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  pgdata:
  miniodata:
