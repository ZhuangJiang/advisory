# 给 SPA 与 API 用的同源反向代理。
#
# 这个文件存在的根本原因是那段 SSE 配置：nginx 默认会缓冲被代理的响应，于是一段实时的推理过程
# 会变成「什么都没有……什么都没有……哗一下全出来」。要让它从正门顺利流出，必须
# `proxy_buffering off`，并把读超时设得比服务端自身 180 秒的运行上限更长（spec §11、§17.13）。

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 文档是凭预签名 URL 直传 MinIO 的，所以这个上限只需要护住 JSON 接口。
    client_max_body_size 16m;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 不与上游保持长连接：连接池里的连接会被跨流复用。
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # SPA 的 history 模式：任何未知路径都是一条前端路由，而不是 404。
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}
