# Single-origin reverse proxy for the SPA and the API.
#
# The SSE block is the reason this file exists: nginx buffers proxied responses by default, which
# turns a live reasoning trace into "nothing, nothing, everything". `proxy_buffering off` plus a read
# timeout longer than the server's own 180 s run limit is what makes streaming work through the
# front door (spec §11, §17.13).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Documents are uploaded straight to MinIO via a presigned URL, so this only guards the JSON API.
    client_max_body_size 16m;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # No keep-alive to the upstream: a pooled connection would be reused across streams.
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # SPA history mode: every unknown path is a route, not a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}
